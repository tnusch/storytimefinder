<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StorytimeFinder{% endblock %}</title>
  <meta name="description" content="{{ t('meta_description') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-text">
        <a href="{{ url_for('main.index') }}"><img class="brand-logo" src="{{ url_for('static', filename='logo.svg') }}" alt="" width="56" height="56"></a>
        <div class="brand-text">
          <a class="brand" href="{{ url_for('main.index') }}">StorytimeFinder</a>
          <p class="tagline">{{ t('tagline') }}</p>
        </div>
      </div>
      <div class="header-controls">
        <select id="lang-select" class="lang-select" aria-label="Language">
          <option value="{{ url_for(request.endpoint, lang='de', **request.view_args) }}"{% if lang == 'de' %} selected{% endif %}>DE</option>
          <option value="{{ url_for(request.endpoint, lang='en', **request.view_args) }}"{% if lang == 'en' %} selected{% endif %}>EN</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="attribution">
        <!-- <span class="yt-badge" aria-hidden="true">
          <svg width="20" height="14" viewBox="0 0 90 64" xmlns="http://www.w3.org/2000/svg">
            <rect width="90" height="64" rx="14" fill="#FF0000"/>
            <polygon points="36,18 64,32 36,46" fill="#fff"/>
          </svg>
        </span> -->
        {{ t('footer_attribution') }}
      </p>
      <p class="footer-links">
        <a href="{{ url_for('main.impressum', lang=lang) }}">{{ t('footer_impressum') }}</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/tnusch/storytimefinder/issues/new?template=audiobook-suggestion.yml" target="_blank" rel="noopener noreferrer">{{ t('footer_suggest') }}</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/tnusch/storytimefinder" target="_blank" rel="noopener noreferrer">{{ t('footer_github') }}</a>
        {% if generated_at %}
          <span class="sep">&middot;</span>
          <span class="updated" title="{{ generated_at | local_date(lang) }}">{{ t('footer_updated') }} {{ generated_at | relative_date(lang) }}</span>
        {% endif %}
      </p>
    </div>
  </footer>

  <script>
    document.getElementById("lang-select").addEventListener("change", function () {
      window.location.href = this.value;
    });
  </script>

  <!-- Vercel Web Analytics - framework-agnostic script, not the @vercel/analytics
       React component: this app has no npm/build step (see CLAUDE.md), so there's
       nothing to "import" it into. Vercel serves this path automatically on any
       deployment with Web Analytics enabled in the project dashboard. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
